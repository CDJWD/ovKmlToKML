name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build -c Release
      - name: Convert sample
        run: |
          dotnet run --project OvkmlToKml.csproj -c Release -- samples/example.ovkml -o samples/example.out.kml
          if grep -q OvCoordType samples/example.out.kml; then
            echo "OvCoordType should have been removed" >&2
            exit 1
          fi
